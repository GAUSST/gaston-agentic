[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gaston-agentic-cli"
version = "1.6.18"
description = "Gaston native engineering CLI for source-free Gaston projects"
requires-python = ">=3.10"
dependencies = ["psutil>=5.9; sys_platform == 'win32' or sys_platform == 'darwin'"]

[project.scripts]
dev = "gaston_cli:main"

[tool.setuptools]
py-modules = ["gaston_cli"]
packages = ["gaston_engine"]

[tool.setuptools.package-dir]
gaston_engine = ".agentic"

[tool.setuptools.package-data]
gaston_engine = ["manifest.json", "policies/*.md"]
