name: Gaston signed-tag release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: read
jobs:
  verify:
    name: Verify ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install declared runtime dependencies
        run: python -m pip install .
      - name: Check canonical release tag and manifest
        shell: python
        env:
          GASTON_REF: ${{ github.ref_name }}
        run: |
          import json, os, pathlib
          manifest = json.loads(pathlib.Path('.agentic/manifest.json').read_text())
          assert manifest['release'] == os.environ['GASTON_REF']
          assert manifest['build'] == os.environ['GASTON_REF'].removeprefix('v')
      - name: Validate complete shipped toolkit
        run: python .agentic/release_audit.py
      - name: Static Python compilation
        run: python -m compileall -q .agentic gaston_cli.py
      - name: Update and CLI regression tests
        shell: bash
        run: python -m unittest discover -s .agentic -p 'test_updater.py' -v && python -m unittest discover -s .agentic -p 'test_launcher.py' -v && python -m unittest discover -s .agentic -p 'test_native_cross_platform.py' -v && python -m unittest discover -s .agentic -p 'test_engineering_quality_contract.py' -v
        env:
          PYTHONPATH: .agentic
  regression:
    name: Complete offline regression suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Run all toolkit unit tests
        timeout-minutes: 25
        run: python -m unittest discover -s .agentic -p 'test_*.py' -q
        env:
          PYTHONPATH: .agentic
  publish:
    name: Publish GitHub release after gates
    needs: [verify, regression]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verify annotated cryptographic tag
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          python - <<'PYCODE'
          import json, os, urllib.request
          repo=os.environ['REPOSITORY']; tag=os.environ['TAG']; token=os.environ['GH_TOKEN']
          def fetch(path):
              req=urllib.request.Request('https://api.github.com/repos/'+repo+'/'+path,headers={'Authorization':'Bearer '+token,'User-Agent':'Gaston-release/1.5.4','Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req,timeout=15) as r: return json.load(r)
          ref=fetch('git/ref/tags/'+tag)
          assert ref['object']['type']=='tag', 'Release tag must be annotated and signed'
          obj=fetch('git/tags/'+ref['object']['sha'])
          assert obj['tag']==tag and obj['verification']['verified'] and obj['verification']['reason']=='valid', 'Release tag signature not verified'
          assert obj['object']['type']=='commit', 'Tag must point to a commit'
          assert obj['object']['sha'].lower()==os.environ['GITHUB_SHA'].lower(), 'Tag points to unexpected commit'
          PYCODE
      - name: Publish pinned source release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes --title "Gaston ${GITHUB_REF_NAME}"
