name: Gaston native CLI validation
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  native-cli:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install installed CLI
        run: python -m pip install .
      - name: Verify centrally packaged engine
        run: python -c "import gaston_engine; from pathlib import Path; p=Path(gaston_engine.__file__).resolve().parent; assert (p/'eng.py').is_file(); assert (p/'native_hooks.py').is_file(); assert p != Path.cwd()/'.agentic'"
      - name: Source-free first-install smoke
        run: python -m unittest discover -s .agentic -p 'test_central_install.py' -v
        env:
          PYTHONPATH: .agentic
          GASTON_INSTALL_SMOKE: '1'
      - name: Preflight compilation (all engine files)
        run: python -m compileall -q .agentic gaston_cli.py
      - name: CLI executable from PATH
        run: dev --help
      - name: Installed core dispatcher smoke (opt-in)
        run: dev --help
        env:
          GASTON_ENGINE_MODE: central
      - name: Complete central runtime and lifecycle regression
        run: python -m unittest discover -s .agentic -p 'test_central_*.py' -v
        env:
          PYTHONPATH: .agentic
      - name: Native locking and dispatcher tests
        run: python -m unittest discover -s .agentic -p 'test_launcher.py' -v
        env:
          PYTHONPATH: .agentic
      - name: Native lifecycle tests
        run: python -m unittest discover -s .agentic -p 'test_native_cross_platform.py' -v
        env:
          PYTHONPATH: .agentic
      - name: Engineering quality contract regression
        run: python -m unittest discover -s .agentic -p 'test_engineering_quality_contract.py' -v
        env:
          PYTHONPATH: .agentic
      - name: Install live browser fixture dependencies
        if: runner.os == 'Linux' && matrix.python-version == '3.11'
        run: |
          npm install --prefix "$RUNNER_TEMP/gaston-live-web" --no-audit --no-fund vite@6 @playwright/test@1.51.1
          node "$RUNNER_TEMP/gaston-live-web/node_modules/@playwright/test/cli.js" install --with-deps chromium
      - name: Real Vite and Chromium integration
        if: runner.os == 'Linux' && matrix.python-version == '3.11'
        run: |
          GASTON_LIVE_WEB_MODULES="$RUNNER_TEMP/gaston-live-web/node_modules" PYTHONPATH=.agentic python -m unittest discover -s .agentic -p 'test_central_visual_web.py' -v
      - name: Package integrity
        run: python .agentic/release_audit.py
      - name: Full regression suite (Linux)
        if: runner.os == 'Linux'
        run: python -m unittest discover -s .agentic -p 'test_*.py' -q
        env:
          PYTHONPATH: .agentic
